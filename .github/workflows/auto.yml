name: Smart Activity Engine

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force one activity update"
        required: false
        default: "false"
  push:
    paths:
      - "auto.json"

permissions:
  contents: write

concurrency:
  group: activity-engine-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Analyze activity
        id: decision
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          TODAY="$(date -u +'%Y-%m-%d')"
          HOUR="$(date -u +'%H')"

          if [ ! -f auto.json ]; then
            printf '%s\n' \
              '{"updates":[],"last_update":"","stats":{"daily_count":0,"weekly_total":0}}' \
              > auto.json
          fi

          jq empty auto.json

          COUNT="$(jq --arg today "$TODAY" \
            '[.updates[] | select(startswith($today))] | length' auto.json)"

          echo "Today's activity: $COUNT"

          if [ "$FORCE" = "true" ]; then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual health recovery" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 22 ]; then
            MIN_ACTIVITY=2
            MAX_ACTIVITY=8
          else
            MIN_ACTIVITY=6
            MAX_ACTIVITY=15
          fi

          if [ "$COUNT" -ge "$MAX_ACTIVITY" ]; then
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            echo "reason=Daily maximum reached ($MAX_ACTIVITY)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$COUNT" -lt "$MIN_ACTIVITY" ]; then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "reason=Below minimum activity ($MIN_ACTIVITY)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RANGE=$((MAX_ACTIVITY - MIN_ACTIVITY))
          POSITION=$((COUNT - MIN_ACTIVITY))
          PROBABILITY=$((60 - (POSITION * 30 / RANGE)))

          [ "$PROBABILITY" -lt 20 ] && PROBABILITY=20

          CHANCE=$((RANDOM % 100))

          if [ "$CHANCE" -lt "$PROBABILITY" ]; then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "reason=Probability ${PROBABILITY}%" >> "$GITHUB_OUTPUT"
          else
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            echo "reason=Probability not met (${PROBABILITY}%)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update activity data
        if: steps.decision.outputs.should_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u +'%Y-%m-%d %H:%M:%S')"

          jq --arg time "$TIMESTAMP" '
            .updates = ((.updates // []) + [$time])
            | .last_update = $time
            | .stats.daily_count =
                ([.updates[] | select(startswith($time[:10]))] | length)
            | .stats.weekly_total =
                ([.updates[]
                  | select(. >= (($time | strptime("%Y-%m-%d %H:%M:%S") | mktime) - 604800 | strftime("%Y-%m-%d %H:%M:%S")))
                ] | length)
          ' auto.json > auto.json.tmp

          mv auto.json.tmp auto.json

          jq empty auto.json

          echo "Activity recorded: $TIMESTAMP"
          echo "Daily count: $(jq '.stats.daily_count' auto.json)"
          echo "Weekly count: $(jq '.stats.weekly_total' auto.json)"

      - name: Generate activity summary
        if: steps.decision.outputs.should_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TODAY_COUNT="$(jq '.stats.daily_count' auto.json)"
          WEEKLY_COUNT="$(jq '.stats.weekly_total' auto.json)"
          LAST_UPDATE="$(jq -r '.last_update' auto.json)"

          cat > activity_summary.md << EOF
          ## 📊 Recent Activity

          | Period | Commits |
          |--------|---------|
          | Today | ${TODAY_COUNT} |
          | This Week | ${WEEKLY_COUNT} |

          **Last Updated:** ${LAST_UPDATE} UTC
          EOF

      - name: Commit activity update
        if: steps.decision.outputs.should_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Flevian11"
          git config user.email "flevianochoka19@gmail.com"

          git add auto.json activity_summary.md

          if git diff --cached --quiet; then
            echo "No activity changes."
            exit 0
          fi

          git commit -m "chore: update activity data"
          git push

      - name: Log outcome
        shell: bash
        run: |
          echo "## Activity Check - $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision: ${{ steps.decision.outputs.should_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"