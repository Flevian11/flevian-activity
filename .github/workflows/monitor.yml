name: Activity Monitor & Health Check

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: activity-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout activity repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Check activity health
        id: health_check
        shell: bash
        run: |
          set -euo pipefail

          LAST_UPDATE="$(jq -r '.last_update // empty' auto.json)"
          TOTAL_COMMITS="$(jq '.updates | length' auto.json)"
          TODAY_COUNT="$(jq '.stats.daily_count // 0' auto.json)"

          if [ -z "$LAST_UPDATE" ]; then
            LAST_UPDATE="1970-01-01 00:00:00"
          fi

          LAST_UPDATE_EPOCH="$(date -u -d "$LAST_UPDATE" +%s 2>/dev/null || echo 0)"
          CURRENT_EPOCH="$(date -u +%s)"
          DIFF=$((CURRENT_EPOCH - LAST_UPDATE_EPOCH))
          HOURS_SINCE=$((DIFF / 3600))

          echo "Last update: $LAST_UPDATE"
          echo "Hours since: $HOURS_SINCE"
          echo "Total activity records: $TOTAL_COMMITS"
          echo "Today's activity: $TODAY_COUNT"

          echo "hours_since=$HOURS_SINCE" >> "$GITHUB_OUTPUT"
          echo "last_update=$LAST_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Trigger activity recovery
        if: steps.health_check.outputs.hours_since > 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Activity engine appears stale."
          gh workflow run auto.yml \
            --repo Flevian11/flevian-activity \
            --ref main \
            -f force=true

      - name: Write health summary
        run: |
          {
            echo "## Activity Health Report"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Last Update | ${{ steps.health_check.outputs.last_update }} |"
            echo "| Hours Since | ${{ steps.health_check.outputs.hours_since }} |"
            echo "| Status | $([ '${{ steps.health_check.outputs.hours_since }}' -gt 4 ] && echo 'Recovery triggered' || echo 'Healthy') |"
          } >> "$GITHUB_STEP_SUMMARY"